; Manim config for a paper-to-manim-video project.
;
; DELIBERATELY ABSENT: pixel_width / pixel_height / frame_rate.
; Setting those here OVERRIDES the -ql/-qh quality flags, which would break the
; two-stage smoke-then-final render strategy. Quality is chosen per invocation
; by scripts/render.py instead.

[CLI]
media_dir = ./media
background_color = BLACK

; Caching is what makes re-rendering a tweaked segment cheap: each self.play()
; writes a partial movie file named after the animation's hash, and an existing
; file is reused. Leave it on.
disable_caching = False
flush_cache = False

verbosity = WARNING
