    action: 왼쪽 메뉴 Pods → 내 Pod 이름 → 상세 패널 위쪽 빨간 Stop → 확인. 켜 둔 Pod가 여러 개면 쓰지 않는 Pod도 Stop. Terminate(휴지통 아이콘, Pod 삭제, 되돌릴 수 없음)는 누르지 않는다
    ui_target: ["Pods (왼쪽 메뉴)", "Pod 이름", "Stop"]
    file: null
    command: null
    change: null
    save: null
    run: null
