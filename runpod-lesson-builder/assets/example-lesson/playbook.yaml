    part: A
    screen: RunPod 콘솔 (console.runpod.io)
    env: 브라우저
    cwd: null
    action: 왼쪽 메뉴 Pods를 누르고 목록에서 내 Pod 이름을 누른다. 여러 개면 C02-L01에서 만든 Pod(Compute type 열로 GPU 종류 확인), 남는 Pod는 S26에서 Stop
    ui_target: ["Pods (왼쪽 메뉴)", "Pod 이름 (예: <POD_A_NAME>)"]
    file: null
    command: null
    change: null
    save: null
    run: null
    result: Pod 목록에 이름 앞 초록 점(Running)이 보인다
    success_check: 초록 점이 보인다
    screenshots: [s01-click-pods-and-pod.png]
    logs: []
    concept: Pod = GPU가 달린 원격 컴퓨터(컨테이너)
