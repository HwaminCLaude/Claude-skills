    troubleshooting: [T18]

troubleshooting:
  T01: Pod 이름 앞이 초록 점이 아니거나 Jupyter Lab이 Ready가 아님 → 1~2분 기다리고 새로고침, 계속이면 Pod 상태 확인
  T02: Ready인데 JupyterLab이 빈 화면 → 30~60초 뒤 Ctrl+Shift+R(강력 새로고침)
  T03: Token authentication is enabled 화면 → Connect 패널의 Jupyter Lab 링크로 다시 들어가기
  T04: New Folder 뒤 이름이 Untitled Folder로 남음 → 화면 반영 지연이거나 이름을 치기 전에 다른 곳을 클릭함. 잠시 기다리고, 그대로면 우클릭 → Rename(F2) → llm-course (바로 아래 Delete 주의)
  T05: groups cannot find name for group ID 경고 → 무시해도 됨
  T06: 프롬프트가 / 인데 pwd 는 /workspace/llm-course → cd /workspace/llm-course 로 확실히 이동
  T07: nvidia-smi command not found 또는 GPU 안 보임 → GPU Pod인지, Pod가 Running인지 확인
  T08: 명령을 연달아 빨리 입력하면 출력이 섞여 보임 → 결과가 나온 뒤 다음 명령 입력
  T09: 붙여 넣은 코드 들여쓰기가 깨짐(IndentationError) → 6행 if 아래 7행은 공백 4칸, 코드 상자의 복사 아이콘으로 통째로 다시 복사
  T10: python ... check_gpu.py No such file or directory → pwd 로 위치 확인, cd /workspace/llm-course. 파일 이름이 다르면(untitled.py, check_gpu.py.py) 우클릭 → Rename(F2) → check_gpu.py
  T11: 노트북을 닫아도 VRAM이 안 줄어듦 → 탭 닫기와 커널 종료는 다르다, Kernel → Shut Down Kernel 또는 왼쪽 아이콘 줄 위에서 두 번째 Running Terminals and Kernels
  T12: File → Shut Down 을 눌러 JupyterLab이 끊김 → RunPod 콘솔 Pod ⋮ → Restart Pod (/workspace 파일은 남음)
  T13: "NameError: name 'torch' is not defined → 셀 1부터 순서대로, 또는 Kernel → Restart Kernel and Run All Cells…"
  T14: 한글 입력 상태로 입력함(예 bash ㅔㅈㅇ command not found, 폴더 이름이 한글 자모) → 한/영 키로 영문 전환 후 다시 입력
  T15: "bash: cd: /workspace/llm-course: No such file or directory → 폴더 이름이 다름(LLM-course, llm_course, Untitled Folder) → File Browser에서 확인, 우클릭 → Rename(F2) → llm-course"
  T16: 노트북 첫 저장 때 Rename file 창이 안 뜸(S13에서 Do not ask for rename on first save 체크) → Untitled.ipynb 우클릭 → Rename(F2) → gpu_check.ipynb
  T17: 같은 이름의 폴더·파일이 이미 있음(강의를 다시 하는 경우) → 폴더는 새로 만들지 말고 S06으로, 기존 파일은 지우지 말고 _old 이름으로 바꿔 보관
  T18: 실습을 마쳤는데 Pods 목록에 초록 점(Running) → 요금이 계속 나감 → S26대로 Stop (Terminate는 삭제라 누르지 않음)
