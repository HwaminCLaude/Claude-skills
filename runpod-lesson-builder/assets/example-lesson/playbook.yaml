# C02-L02 실습 원본 절차서 (Execution Playbook) — 단일 원본
# README, storyboard, 검증 스크립트(tools/check_lesson.py)는 모두 이 파일을 기준으로 맞춘다.
# 모든 값은 2026-10-28 Pod A(<POD_A_NAME>)에서 실제로 수행·촬영한 결과다.
# 보충 촬영(S05·S06·S17·S23의 *-scratch* 그림)은 같은 날 Pod B(<POD_B_NAME>)의 임시 폴더
# /workspace/c02l02-fix 에서 tools/jlab.py로 촬영하고 폴더를 지웠다(README 캡션에 표시). S26 그림은 s02 패널에 Stop 위치만 덧그림.
lesson:
  id: C02-L02
  title: JupyterLab 접속하고 GPU 확인하기 — Terminal · Python 파일 · Notebook
  captured_at: "2026-10-28 03:00-03:10 KST"
  environment:
    gpu: NVIDIA A40 (46068 MiB), Secure Cloud CA-MTL-1
    image: runpod/pytorch:1.4.1-cu1281-torch280-ubuntu2404
    driver: "595.91.07 (CUDA Version 13.2)"
    jupyterlab: "4.6.4"
    python: "3.12.3 (/usr/local/bin/python)"
    pytorch: "2.8.0+cu128"
  start_condition: RunPod 콘솔에 로그인되어 있고 Pod가 Running, Connect 패널의 Jupyter Lab이 Ready
  done_condition: /workspace/llm-course 에 check_gpu.py 와 gpu_check.ipynb 가 있고, 세 방법 모두 NVIDIA A40 / CUDA True 확인, 마지막에 Pod를 Stop

steps:
