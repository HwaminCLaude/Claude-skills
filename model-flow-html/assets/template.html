<title>모델 구조 흐름도</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+KR:wght@400;500;600&family=Noto+Serif+KR:wght@600;700&display=swap">
<style>
/* 배치: 왼쪽 레일(논문식 구조도 + 단계 글) + 오른쪽 입체 판(모델 전체가 위에서 아래로 놓인다). 좁은 화면에서는 판이 위, 레일이 아래 */
:root {
  --bg: #f1f3f6; --panel: #ffffff; --ink: #141a22; --ink2: #586270; --line: #d3d8e0;
  --accent: #1c7a92; --accent-ink: #ffffff; --warn: #b8402f;
  --c-bg: #e7ebf0; --c-plate: #dde1e8; --c-plateOn: #d3e6ec; --c-plateDone: #d6dee4;
  --c-cell: #bcc4cf; --c-dot: #3b4553; --c-faint: #cdd3db; --c-w: #4f74b3; --c-act: #7b63c9;
  --c-base: #8791a0; --c-k1: #d5722a; --c-k2: #2b8cab; --c-k3: #56974a; --c-bad: #cc4740; --c-onc: #ffffff;
  --c-ink: #141a22; --c-ink2: #586270; --c-line: #aab2be; --c-accent: #1c7a92;
  --lora: var(--c-k3);
  --f-display: "Noto Serif KR", "Batang", "AppleMyungjo", serif;
  --f-body: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0b0e12; --panel: #11151b; --ink: #e8ecf1; --ink2: #98a2b0; --line: #262d37;
    --accent: #5bbad2; --accent-ink: #05212a; --warn: #f0776b;
    --c-bg: #07090c; --c-plate: #12161c; --c-plateOn: #16303a; --c-plateDone: #141f25;
    --c-cell: #39414d; --c-dot: #cdd4dd; --c-faint: #232a33; --c-w: #5d8bd6; --c-act: #a48fea;
    --c-base: #8791a0; --c-k1: #e08a3c; --c-k2: #4aa8c4; --c-k3: #74b361; --c-bad: #e2625b; --c-onc: #0b1014;
    --c-ink: #e8ecf1; --c-ink2: #98a2b0; --c-line: #3a4350; --c-accent: #5bbad2;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0b0e12; --panel: #11151b; --ink: #e8ecf1; --ink2: #98a2b0; --line: #262d37;
  --accent: #5bbad2; --accent-ink: #05212a; --warn: #f0776b;
  --c-bg: #07090c; --c-plate: #12161c; --c-plateOn: #16303a; --c-plateDone: #141f25;
  --c-cell: #39414d; --c-dot: #cdd4dd; --c-faint: #232a33; --c-w: #5d8bd6; --c-act: #a48fea;
  --c-base: #8791a0; --c-k1: #e08a3c; --c-k2: #4aa8c4; --c-k3: #74b361; --c-bad: #e2625b; --c-onc: #0b1014;
  --c-ink: #e8ecf1; --c-ink2: #98a2b0; --c-line: #3a4350; --c-accent: #5bbad2;
  color-scheme: dark;
}
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 15px; line-height: 1.7; }
* { box-sizing: border-box; }
[hidden] { display: none !important; }
.app { height: 100%; display: grid; grid-template-columns: minmax(300px, 410px) minmax(0, 1fr); }

.rail {
  display: flex; flex-direction: column; gap: 14px; min-width: 0; min-height: 0; overflow-y: auto;
  background: var(--panel); border-right: 1px solid var(--line);
  padding-top: 20px; padding-bottom: 0;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  word-break: keep-all; overflow-wrap: anywhere;
}
.rail > * { margin: 0 6px; }
.eyebrow { margin: 0; font-size: 12px; letter-spacing: 0.08em; color: var(--accent); font-weight: 600; }
h1 { margin: 0; font-family: var(--f-display); font-size: 22px; line-height: 1.3; font-weight: 700; text-wrap: balance; }

/* 논문식 구조도: 위에서 아래로 쌓인 블록. 파랑 = 원래 가중치, 색 꼬리표 = LoRA, 보라 옆길 = 잔차 연결. 모두 스크립트가 구성에서 만든다 */
.archbox > summary {
  display: flex; align-items: baseline; flex-wrap: wrap; gap: 0 8px; padding: 0 0 6px; cursor: pointer; list-style: none;
  font-size: 12.5px; font-weight: 600; color: var(--ink);
}
.archbox > summary::-webkit-details-marker { display: none; }
.archbox > summary::before { content: "▾"; color: var(--ink2); }
.archbox:not([open]) > summary::before { content: "▸"; }
.archbox > summary em { font-style: normal; }
.archbox > summary span { font-weight: 400; color: var(--ink2); }
.arch { display: flex; flex-direction: column; gap: 4px; font-size: 12px; line-height: 1.25; }
.arch button { font: inherit; color: inherit; cursor: pointer; text-align: left; }
.arch .blk {
  position: relative; display: flex; justify-content: space-between; align-items: baseline; gap: 8px; width: 100%;
  padding: 2px 8px; border-radius: 4px; border: 1px solid var(--line); background: var(--bg); color: var(--ink);
}
.arch .blk::before { content: ""; position: absolute; left: 50%; top: -5px; height: 4px; border-left: 1px solid var(--ink2); }
.arch > .blk:first-child::before { display: none; }
.arch .blk span { font-family: var(--f-mono); font-size: 11px; opacity: 0.85; white-space: nowrap; }
.arch .frz { background: var(--c-w); border-color: var(--c-w); color: var(--c-onc); }
.arch .add { border-style: dashed; border-color: var(--c-act); }
.arch .stack { display: flex; flex-direction: column; gap: 4px; padding: 5px 6px 4px; border: 1px solid var(--ink2); border-radius: 6px; }
.arch .tag { align-self: flex-start; padding: 0 7px; border-radius: 4px; border: 1px solid var(--ink2); background: var(--panel); font-weight: 600; }
/* 잔차 연결: 정규화와 부분층을 건너뛰어 더하기로 들어가는 옆길 (입체 그림에서는 가운데 줄기) */
.arch .res { position: relative; isolation: isolate; display: flex; flex-direction: column; gap: 4px; padding: 0 16px; }
.arch .res::before {
  content: ""; position: absolute; z-index: -1; left: 4px; top: -3px; bottom: 9px; width: calc(50% - 4px);
  border: 2px solid var(--c-act); border-right: 0; border-radius: 6px 0 0 6px;
}
.arch .res::after { content: ""; position: absolute; left: 10px; bottom: 5px; border: 5px solid transparent; border-left-color: var(--c-act); }
.arch .pair { display: flex; gap: 4px; align-items: stretch; }
.arch .pair .blk { flex: 1; min-width: 0; }
.arch .lora { flex: none; padding: 1px 7px; border-radius: 4px; border: 1px solid var(--lora); background: var(--lora); color: var(--c-onc); font-weight: 600; white-space: nowrap; }
.arch.nolora .lora { opacity: 0.3; text-decoration: line-through; }
.arch .sum, .arch .total { margin: 0; font-family: var(--f-mono); font-size: 11px; color: var(--ink2); font-variant-numeric: tabular-nums; }
.arch .total b { color: var(--ink); font-weight: 600; }
.arch [aria-current="step"] { outline: 2px solid var(--ink); outline-offset: 1px; }
.arch button:hover { filter: brightness(1.08); }

.step { flex: 1 0 auto; display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.where { margin: 0; font-family: var(--f-mono); font-size: 12px; color: var(--ink2); }
h2 { margin: 0; font-family: var(--f-display); font-size: 20px; line-height: 1.35; font-weight: 700; text-wrap: balance; }
.body p { margin: 0 0 8px; max-width: 34em; font-size: 14px; line-height: 1.65; }
.body b { font-weight: 600; color: var(--accent); font-variant-numeric: tabular-nums; }
.body code { font-family: var(--f-mono); font-size: 0.9em; padding: 1px 4px; border-radius: 4px; background: var(--bg); }
.src { margin: 0; font-size: 12px; color: var(--ink2); }
/* 좁은 화면에서는 판 위의 작은 글자가 숨으므로(7.5px 미만) 같은 예시 문장을 레일에 한 번 더 보인다 */
.narrow { display: none; }
.narrow .msg { margin: 0 0 6px; padding: 6px 9px; border-radius: 6px; background: var(--bg); font-size: 13px; line-height: 1.55; overflow-wrap: anywhere; }
.narrow .msg i { margin-right: 6px; font-style: normal; font-family: var(--f-mono); font-size: 11.5px; color: var(--ink2); }

.pager {
  position: sticky; bottom: 0; z-index: 2; display: flex; align-items: center; gap: 10px;
  padding: 10px 0 max(14px, env(safe-area-inset-bottom, 0px)); background: var(--panel); border-top: 1px solid var(--line);
}
.pager .count { flex: 1; text-align: center; font-family: var(--f-mono); font-size: 12px; color: var(--ink2); font-variant-numeric: tabular-nums; }
.pager button, .reset {
  padding: 7px 16px; border-radius: 6px; border: 1px solid var(--line); background: var(--panel); color: var(--ink);
  font: inherit; font-size: 14px; cursor: pointer;
}
.pager button.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 600; }
.pager button:disabled { opacity: 0.4; cursor: default; }
button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.stage { position: relative; min-width: 0; min-height: 0; background: var(--c-bg); overflow: hidden; }
#cv { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: grab; }
#cv.drag { cursor: grabbing; }
#cv.hot { cursor: pointer; }
.reset { position: absolute; top: calc(14px + env(safe-area-inset-top, 0px)); right: max(16px, env(safe-area-inset-right, 0px)); font-size: 13px; padding: 6px 12px; }
.pick {
  position: absolute; left: max(16px, env(safe-area-inset-left, 0px)); bottom: 12px; max-width: calc(100% - 32px);
  display: flex; flex-wrap: wrap; align-items: center; gap: 6px; padding: 6px 8px; border-radius: 8px;
  background: color-mix(in srgb, var(--panel) 88%, transparent); border: 1px solid var(--line); font-size: 12.5px;
}
.pick .key { display: inline-flex; align-items: center; gap: 5px; color: var(--ink2); margin-right: 4px; }
.pick i { width: 10px; height: 10px; border-radius: 2px; display: block; }
.pick small { font-size: 11px; color: var(--ink2); }
.pick .lab { color: var(--ink2); margin: 0 2px 0 6px; }
.pick button {
  display: inline-flex; align-items: center; gap: 6px; padding: 4px 9px; border-radius: 6px; border: 1px solid var(--line);
  background: transparent; color: var(--ink); font: inherit; cursor: pointer;
}
.pick button[aria-pressed="true"] { border-color: var(--ink); font-weight: 600; background: var(--bg); }
.hint {
  position: absolute; right: max(16px, env(safe-area-inset-right, 0px)); bottom: 14px; margin: 0; font-size: 12px; color: var(--ink2);
  background: color-mix(in srgb, var(--c-bg) 82%, transparent); padding: 3px 8px; border-radius: 6px;
}
.tip {
  position: absolute; z-index: 3; max-width: 310px; padding: 6px 10px; border-radius: 6px; pointer-events: none;
  background: var(--ink); color: var(--panel); font-size: 12.5px; line-height: 1.5; font-variant-numeric: tabular-nums;
}
.err { position: absolute; z-index: 4; left: 16px; top: 16px; right: 16px; padding: 10px 12px; border-radius: 6px; background: var(--panel); border: 1px solid var(--warn); color: var(--warn); font-size: 13px; }

@media (max-width: 1280px) { .hint { display: none; } }
@media (max-width: 1100px) { .pick small { display: none; } }
@media (max-width: 820px) {
  .app { grid-template-columns: minmax(0, 1fr); grid-template-rows: minmax(260px, 48%) minmax(0, 1fr); }
  .stage { order: -1; }
  .rail { border-right: 0; border-top: 1px solid var(--line); padding-top: 14px; gap: 10px; }
  h1 { font-size: 20px; }
  .pick { font-size: 11.5px; gap: 4px; padding: 5px 6px; }
  .pick button { padding: 3px 6px; gap: 4px; }
  .pick .key { margin-right: 2px; }
  .pick .lab { margin: 0 0 0 2px; }
  .narrow { display: block; }
}
</style>

<div class="app">
  <aside class="rail" aria-label="구조도와 단계 해설">
    <header class="brand">
      <p class="eyebrow" id="eyebrow">모델 구조 시각화</p>
      <h1 id="h1"></h1>
    </header>
    <details class="archbox" id="archbox" open>
      <summary><em id="archname"></em> 구조도 <span>블록을 누르면 그 자리로</span></summary>
      <nav class="arch" id="arch" aria-label="모델 구조도"></nav>
    </details>
    <section class="step" aria-live="polite">
      <p class="where" id="where"></p>
      <h2 id="stitle"></h2>
      <div class="body" id="sbody"></div>
      <p class="src" id="ssrc"></p>
    </section>
    <footer class="pager">
      <button type="button" id="prev">이전</button>
      <span class="count" id="count"></span>
      <button type="button" id="next" class="primary">다음</button>
    </footer>
  </aside>
  <main class="stage" id="stage">
    <canvas id="cv" role="img" aria-label="위에서 아래로 놓인 모델 전체 구조의 입체 그림"></canvas>
    <button type="button" class="reset" id="reset">이 단계 보기</button>
    <div class="pick" id="pick" role="group" aria-label="색 풀이와 어댑터 고르기"></div>
    <p class="hint">끌기 회전 · 휠 확대 · Shift+끌기 이동 · ← → 단계</p>
    <div class="tip" id="tip" hidden></div>
    <div class="err" id="err" hidden></div>
  </main>
</div>

<script>
/* <mf:config> ── EDIT HERE ── 그릴 모델, 어댑터, 예시 입력은 이 블록에서만 고친다. 페이지의 모든 숫자는 여기서 계산된다 */
const MODEL = {
  name: 'Llama-3.2-1B-Instruct',
  hidden: 2048, layers: 16, heads: 32, kvHeads: 8, headDim: 64, ffn: 8192, vocab: 128256,
  norm: 'rms',          // 'rms'(가중치만) | 'ln'(가중치 + 편향)
  mlp: 'gated',         // 'gated'(gate, up → act(gate)×up → down) | 'plain'(fc → act → proj)
  act: 'SiLU',          // 페이지에 쓰는 활성화 함수 이름
  pos: 'rope',          // 'rope'(어텐션 안에서 회전, 표 없음) | 'learned'(maxPos × hidden 표를 임베딩 뒤에 더함) | 'none'
  maxPos: 0,
  bias: { q: false, k: false, v: false, o: false, mlp: false },
  tied: true,           // LM head가 임베딩 표를 다시 씀(추가 값 없음, '공유'로 그림)
  names: { q: 'q_proj', k: 'k_proj', v: 'v_proj', o: 'o_proj', gate: 'gate_proj', up: 'up_proj', down: 'down_proj', fc: 'fc', proj: 'proj',
           norm1: 'input_layernorm', norm2: 'post_attention_layernorm', normF: 'norm', emb: 'embed_tokens', pos: 'wpe', head: 'lm_head' },
  frozen: '4비트(NF4)',  // 미세조정할 때 원래 가중치를 두는 방식. 미세조정 페이지가 아니면 ''
  grid: 256,            // 원래 가중치 판의 모눈 한 칸 = grid × grid 값
  expect: { total: 1235814400, trainable: 11272192 },   // 공개된 합계. 검사하지 않으려면 null. 선택: src(출처 줄에 쓸 이름, 기본 '공개된 합계')
};
const LORA = { r: 16, alpha: 32, targets: ['q', 'k', 'v', 'o', 'gate', 'up', 'down'] };   // null = 어댑터 없음
const CONDS = [                                   // 범례 버튼. lora:false = 어댑터 없는 원래 모델. color는 base | k1 | k2 | k3
  { label: 'LoRA 없음(기준 모델)', color: 'base', lora: false },
  { label: 'LoRA 붙임', color: 'k3', lora: true },
];
const EXAMPLE = {   // 모델에 넣어 볼 입력 하나. 토큰 수는 실제 토크나이저와 채팅 템플릿으로 잰 값
  messages: [
    { role: 'system', content: '질문에 한두 문장으로 답한다.' },
    { role: 'user', content: 'LoRA가 무엇인지 알려 줘.' },
    { role: 'assistant', content: 'LoRA는 얼린 가중치 옆에 작은 행렬 두 개를 붙여 그 둘만 학습하는 방법입니다.' },
  ],
  // transformers 4.57 apply_chat_template(date_string='26 Jul 2024')와 Llama-3.2-1B-Instruct 토크나이저로 잼
  tokens: { system: 11, user: 9, template: 35, prompt: 55, target: 28, total: 83 },
  // target = total − prompt (assistant 본문 27 + 턴 끝 표시 1)
  src: '새로 쓴 합성 예시',   // 선택: 입력·토큰 단계의 출처 줄 앞에 붙는다(예: '논문 표 <번호>의 예시')
  // plain: true,            // 선택: 채팅 틀이 없는 모델(count_tokens.py --plain 으로 잰 값). 입력 단계 글이 '채팅 템플릿'을 말하지 않는다
};
const TRAIN = { show: true };      // 손실은 답 토큰에서만(프롬프트 자리는 −100으로 가림). LORA가 있을 때만 그린다. 손실을 어디에 거는지 모르면 false. 선택: src(출처 줄)
const RESULTS = null;              // 선택: 막대그래프 { title, unit: '%', metrics: [...], values: [[조건별 값] 지표마다], ci: [[[lo, hi] 조건마다] 지표마다] | null, src }
/* </mf:config> */

/* <mf:count> — every count on the page comes from here; scripts/params.mjs reads this block */
function countParams(M, LR) {
  const h = M.hidden, qd = M.heads * M.headDim, kd = M.kvHeads * M.headDim, f = M.ffn;
  const bias = M.bias || {};
  const norm = M.norm === 'ln' ? 2 * h : h;
  const lin = (din, dout, b) => din * dout + (b ? dout : 0);
  const shapes = { q: [h, qd], k: [h, kd], v: [h, kd], o: [qd, h] };
  if (M.mlp === 'gated') Object.assign(shapes, { gate: [h, f], up: [h, f], down: [f, h] });
  else Object.assign(shapes, { fc: [h, f], proj: [f, h] });
  const layer = { norm1: norm, norm2: norm };
  for (const k in shapes) layer[k] = lin(shapes[k][0], shapes[k][1], 'qkvo'.includes(k) && k.length === 1 ? bias[k] : bias.mlp);
  layer.total = Object.values(layer).reduce((a, b) => a + b, 0);
  const emb = M.vocab * h, pos = M.pos === 'learned' ? M.maxPos * h : 0, head = M.tied ? 0 : M.vocab * h;
  const out = { shapes, layer, emb, pos, head, normF: norm, layers: layer.total * M.layers };
  out.total = emb + pos + out.layers + norm + head;
  out.lora = null;
  if (LR && LR.targets && LR.targets.length) {
    const per = {};
    for (const t of LR.targets) { if (!shapes[t]) throw new Error('LoRA target not in this model: ' + t); per[t] = LR.r * (shapes[t][0] + shapes[t][1]); }
    const perLayer = Object.values(per).reduce((a, b) => a + b, 0);
    out.lora = { r: LR.r, alpha: LR.alpha, perModule: per, perLayer, sites: LR.targets.length * M.layers, total: perLayer * M.layers };
    out.lora.ratio = out.lora.total / out.total;
  }
  return out;
}
/* </mf:count> */

(() => {
'use strict';
const $ = (s) => document.querySelector(s);
const cv = $('#cv'), ctx = cv.getContext('2d'), stage = $('#stage'), tip = $('#tip'), errBox = $('#err');
const errs = [];
function warn(m) { errs.push(m); errBox.textContent = errs.join(' / '); errBox.hidden = false; }
window.addEventListener('error', (e) => warn('그림을 그리지 못했습니다: ' + e.message));
const RM = !!(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches);
const SANS = '"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif';
const MONO = '"IBM Plex Mono",ui-monospace,"Cascadia Mono",Consolas,monospace';

  ctx.stroke();
}
function drawField(f) {
  if (!proj(f.c[0], f.c[1], f.c[2], T4)) return;
  const px = f.size * T4[3];
  const stride = !f.flow && px < 1.5 ? Math.min(12, Math.ceil((1.5 / px) * (1.5 / px))) : 1;
  const grow = stride > 1 ? 1.3 : 1, cu = f.cur, rgb = f.rgb, n = f.n, sz = f.size;
  ctx.globalAlpha = f.a;
  for (let k = 0; k < n; k += stride) {
    const q = 3 * k;
    if (!proj(cu[q], cu[q + 1], cu[q + 2], T4)) continue;
    const s = Math.max(f.flow ? 3 : 1.4, sz * T4[3]) * grow;
    ctx.fillStyle = rgbK(rgb[q] & 0xFC, rgb[q + 1] & 0xFC, rgb[q + 2] & 0xFC);
    ctx.fillRect(T4[0] - s / 2, T4[1] - s / 2, s, s);
  }
  if (f.meta && f.a > 0.5) fpicks.push(f);
}
/* 멀리 있는 선은 가늘게 그려 원래 가중치(파랑)를 덮지 않게 한다. fixw면 굵기 고정 */
function drawLine(l, s) {
  ctx.globalAlpha = l.a; ctx.strokeStyle = css(PAL[l.c]); ctx.lineWidth = l.fixw ? l.w : clamp(l.w * s / 6, 0.75, l.w); ctx.lineJoin = 'round'; ctx.lineCap = 'round';
  ctx.beginPath(); let on = false;
  for (const p of l.pts) {
    if (!proj(p[0], p[1], p[2], T4)) { on = false; continue; }
    if (on) ctx.lineTo(T4[0], T4[1]); else { ctx.moveTo(T4[0], T4[1]); on = true; }
  }
  ctx.stroke();
}
function drawText(t) {
  if (!proj(t.p[0], t.p[1], t.p[2], T4)) return;
  if (T4[0] < -320 || T4[0] > W + 320 || T4[1] < -40 || T4[1] > H + 40) return;
  let px = t.size * T4[3];
  if (px < 7.5) return;
  if (px > 30) px = 30;
  ctx.globalAlpha = t.a;
  ctx.font = (t.w || 500) + ' ' + px.toFixed(1) + 'px ' + (t.mono ? MONO : SANS);
  ctx.textAlign = t.al || 'center'; ctx.textBaseline = 'middle';
  ctx.fillStyle = css(PAL[t.c]); ctx.fillText(t.s, T4[0], T4[1]);
}
function drawTitles() {
  const prog = progress();
  ctx.textBaseline = 'middle'; ctx.textAlign = 'right';
  for (const s of PL) {
    if (!proj(PXL - 1.0, 0, s.z0 + 1.8, T4)) continue;
    if (T4[0] < -100 || T4[0] > W + 300 || T4[1] < -20 || T4[1] > H + 20) continue;
    /* 전체 보기에서는 크게 다가가기 전까지 far 이름표만 남긴다(층 수가 적어 카메라가 가까워도 4개 안팎) */
    const raw = 2.6 * T4[3], near = raw >= (cur.st === -1 ? 14 : 6);
    if (!near && !s.far) continue;
    const label = near ? s.name : s.far, px = near ? clamp(raw, 10, 17) : 11;
    ctx.globalAlpha = s.st === cur.st || cur.st === -1 ? 1 : 0.75;
    ctx.fillStyle = css(PAL[s.st === cur.st ? 'accent' : s.st < prog || cur.st === -1 ? 'ink' : 'ink2']);
    ctx.font = '600 ' + px.toFixed(1) + 'px ' + SANS;
    /* 오른쪽 맞춤 글자가 화면 왼쪽 밖으로 잘리지 않게 한다 */
    ctx.fillText(label, Math.max(T4[0], ctx.measureText(label).width + 8), T4[1]);
  }
}
function draw() {
  setupCam();
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.globalAlpha = 1; ctx.fillStyle = css(PAL.bg); ctx.fillRect(0, 0, W, H);
  drawPlates();
  const list = [];
  for (const b of boxes) if (b.a > 0.02 && inView(b.cx, b.cy, b.cz, b.rad)) list.push([T4[2] - b.y0 * 8, 0, b, b.rad * T4[3]]);
  for (const f of fields) if (f.a > 0.02 && (f.flow || inView(f.c[0], f.c[1], f.c[2], f.rad))) list.push([f.flow ? -1e9 : T4[2] + 0.01 - f.c[1] * 8, 1, f]);
  for (const l of lines) if (l.a > 0.02 && inView(l.mx, 0.3, l.mz, l.rad) && l.rad * T4[3] > 1.5) list.push([T4[2] + 2, 2, l, T4[3]]);
  list.sort((p, q) => q[0] - p[0]);
  picks = []; fpicks = [];
  for (const e of list) { if (e[1] === 0) drawBox(e[2], e[3]); else if (e[1] === 1) drawField(e[2]); else drawLine(e[2], e[3]); }
  for (const t of texts) if (t.a > 0.02) drawText(t);
  drawTitles();
  ctx.globalAlpha = 1;
}
let last = 0;
function frame(t) {
  const dt = Math.min(0.05, (t - last) / 1000 || 0.016); last = t;
  if (!RM || quiet < 140) { update(dt, false); draw(); quiet++; if (ptr) hover(ptr[0], ptr[1]); }
  requestAnimationFrame(frame);
}

/* ---------------------------------------------------------------- 가리키기 */
function inPoly(x, y, q) {
  let c = false;
  for (let i = 0, j = q.length - 1; i < q.length; j = i++) {
    if ((q[i][1] > y) !== (q[j][1] > y) && x < (q[j][0] - q[i][0]) * (y - q[i][1]) / (q[j][1] - q[i][1]) + q[i][0]) c = !c;
  }
  return c;
}
function plateAt(x, y) { for (const s of PL) if (s.vis && inPoly(x, y, s.q)) return s; return null; }
function metaAt(x, y) {
  for (let i = picks.length - 1; i >= 0; i--) for (const q of picks[i].polys) if (inPoly(x, y, q)) return picks[i].meta;
  let best = null, bd = 60;
  for (const f of fpicks) {
    const cu = f.cur;
    for (let k = 0; k < f.n; k++) {
      if (!proj(cu[3 * k], cu[3 * k + 1], cu[3 * k + 2], T4)) continue;
      const dx = T4[0] - x, dy = T4[1] - y, d = dx * dx + dy * dy;
      if (d < bd) { bd = d; best = f.meta(k, phaseOf(f.st)); }
    }
  }
  return best;
}
let ptr = null, drag = null;
function hover(x, y) {
  if (drag) { tip.hidden = true; return; }
  const m = metaAt(x, y), p = m ? null : plateAt(x, y);
  cv.classList.toggle('hot', !!m || !!(p && (p.st !== cur.st || p.L)));
  if (!m) { tip.hidden = true; return; }
  if (tip.textContent !== m) tip.textContent = m;
  tip.hidden = false;
  const tw = tip.offsetWidth, th = tip.offsetHeight;
  tip.style.left = clamp(x + 14, 8, W - tw - 8) + 'px';
  tip.style.top = clamp(y - th - 12 < 8 ? y + 18 : y - th - 12, 8, H - th - 8) + 'px';
}

/* ---------------------------------------------------------------- 조작 */
const ptrs = new Map();
const local = (e) => { const r = cv.getBoundingClientRect(); return [e.clientX - r.left, e.clientY - r.top]; };
cv.addEventListener('pointerdown', (e) => {
  cv.setPointerCapture(e.pointerId); ptrs.set(e.pointerId, [e.clientX, e.clientY]);
  if (!drag) drag = { moved: 0, pan: e.shiftKey || e.button === 2 || e.button === 1, pinch: 0 };
  if (ptrs.size === 2) { const v = [...ptrs.values()]; drag.pinch = Math.hypot(v[0][0] - v[1][0], v[0][1] - v[1][1]); }
  cv.classList.add('drag'); tip.hidden = true;
});
cv.addEventListener('pointermove', (e) => {
  const prev = ptrs.get(e.pointerId);
  if (!prev) { ptr = local(e); hover(ptr[0], ptr[1]); return; }
  const dx = e.clientX - prev[0], dy = e.clientY - prev[1];
  ptrs.set(e.pointerId, [e.clientX, e.clientY]);
  if (!drag) return;
  drag.moved += Math.abs(dx) + Math.abs(dy);
  if (ptrs.size === 2) {
    const v = [...ptrs.values()], d = Math.hypot(v[0][0] - v[1][0], v[0][1] - v[1][1]);
    if (drag.pinch > 0 && d > 0) { goal.dist = clamp(goal.dist * drag.pinch / d, 10, MAXD); cam.dist = goal.dist; }
    drag.pinch = d;
  } else if (drag.pan) {
    const k = cam.dist / F, gl = Math.hypot(FW[0], FW[2]) || 1, gx = FW[0] / gl, gz = FW[2] / gl;
    sweep = null;
    goal.tx += (-RT[0] * dx + gx * dy * 1.5) * k; goal.tz += (-RT[2] * dx + gz * dy * 1.5) * k;
    cam.tx = goal.tx; cam.tz = goal.tz;
  } else {
    goal.yaw -= dx * 0.006; goal.pitch = clamp(goal.pitch + dy * 0.005, 0.18, 1.48);
    cam.yaw = goal.yaw; cam.pitch = goal.pitch;
  }
  wake();
});
function endPtr(e) {
  const had = ptrs.delete(e.pointerId);
  if (ptrs.size > 0) { if (drag) drag.pinch = 0; return; }
  const d = drag; drag = null; cv.classList.remove('drag');
  if (had && d && d.moved < 6 && e.type === 'pointerup') {
    const p = local(e), s = plateAt(p[0], p[1]);
    if (s && !metaAt(p[0], p[1])) {
      if (s.st !== cur.st && ST[s.st].first >= 0) go(ST[s.st].first);
      if (s.L) { sweep = null; goal.tz = (s.z0 + s.z1) / 2; wake(); }
    }
  }
}
cv.addEventListener('pointerup', endPtr);
cv.addEventListener('pointercancel', endPtr);
cv.addEventListener('pointerleave', () => { ptr = null; tip.hidden = true; });
cv.addEventListener('contextmenu', (e) => e.preventDefault());
cv.addEventListener('wheel', (e) => { e.preventDefault(); goal.dist = clamp(goal.dist * Math.exp(e.deltaY * 0.0012), 10, MAXD); wake(); }, { passive: false });
document.addEventListener('keydown', (e) => {
  if (e.altKey || e.ctrlKey || e.metaKey) return;
  if (e.key === 'ArrowRight' || e.key === 'PageDown') { go(stepIdx + 1); e.preventDefault(); }
  else if (e.key === 'ArrowLeft' || e.key === 'PageUp') { go(stepIdx - 1); e.preventDefault(); }
  else if (e.key === 'Home') { go(0); e.preventDefault(); }
  else if (e.key === 'End') { go(STEPS.length - 1); e.preventDefault(); }
});

/* ---------------------------------------------------------------- 레일: 구조도, 단계 글, 어댑터 (모두 구성에서 만든다) */
function railHTML() {
  const blk = (id, go, cls, label, num) => '<button type="button" class="blk' + (cls ? ' ' + cls : '') + '" id="' + id + '" data-go="' + go + '">' + esc(label) + ' <span>' + esc(num) + '</span></button>';
  const tag = (id, go, list) => (list.length ? '<button type="button" class="lora" id="' + id + '" data-go="' + go + '">+ LoRA ' + esc(list.join(' ')) + '</button>' : '');
  const hw = fmt(V) + ' × ' + fmt(HID);
  let s = blk('r-in', 'input', '', '입력 토큰', fmt(NT)) + blk('r-emb', 'emb', 'frz', '토큰 임베딩', hw);
  if (LEARNED) s += blk('r-pos', 'emb', 'frz', '위치 임베딩', fmt(MODEL.maxPos) + ' × ' + fmt(HID));
  s += '<div class="stack"><button type="button" class="tag" id="r-xN" data-go="layers">층 × ' + NL + '</button>';
  s += '<div class="res">' + blk('r-n1', 'attn1', 'frz', NORM, fmt(COUNTS.layer.norm1))
    + '<div class="pair">' + blk('r-att', 'attn2', 'frz', '마스크드 멀티헤드 어텐션', 'q k v o') + tag('r-l1', 'lora', at) + '</div>'
    + blk('r-add1', 'attn2', 'add', '더하기', '잔차 연결') + '</div>';
  s += '<div class="res">' + blk('r-n2', 'mlp1', 'frz', NORM, fmt(COUNTS.layer.norm2))
    + '<div class="pair">' + blk('r-ffn', 'mlp1', 'frz', '피드포워드', MLPK.join(' ')) + tag('r-l2', CU && CU.sec === 3 ? 'lora' : 'mlp1', mt) + '</div>'
    + blk('r-add2', 'mlp1', 'add', '더하기', '잔차 연결') + '</div>';
  s += '<p class="sum">한 층: ' + WORD + ' ' + fmt(COUNTS.layer.total) + (FT ? ' · 학습 ' + fmt(COUNTS.lora.perLayer) : '') + '</p></div>';
  s += blk('r-fn', 'out', 'frz', NORM, fmt(COUNTS.normF)) + blk('r-head', 'out', 'frz', 'LM head · Linear', MODEL.tied ? '공유(tied)' : hw);
  s += blk('r-soft', 'soft', '', 'Softmax', '다음 토큰');
  if (RS) s += blk('r-res', 'results', '', RESULTS.title || '결과', '지표 ' + RESULTS.metrics.length + '개');
  s += '<p class="total">' + WORD + ' <b>' + fmt(COUNTS.total) + '</b>' + (FT ? ' · 학습하는 값 <b>' + fmt(COUNTS.lora.total) + '</b>' : '') + '</p>';
  return s;
}
function pickHTML() {
  let s = '<span class="key"><i style="background: var(--c-w)"></i>' + WORD + ' <small>모눈 한 칸 = ' + GC + '개</small></span>'
    + '<span class="key"><i style="background: var(--c-act)"></i>흐르는 값</span>';
  if (FT && CONDS.length > 1) {
    s += '<span class="lab">LoRA</span>';
    CONDS.forEach((c, k) => { s += '<button type="button" id="c' + k + '" data-k="' + k + '" aria-pressed="false"><i style="background: var(--c-' + c.color + ')"></i>' + esc(c.label) + '</button>'; });
  } else if (FT) s += '<span class="key"><i style="background: var(--lora)"></i>LoRA</span>';
  return s;
}
$('#eyebrow').textContent = FT ? 'LoRA 미세조정 · 모델 구조 시각화' : '모델 구조 시각화';
$('#h1').textContent = MODEL.name + ' 구조 흐름도';
$('#archname').textContent = MODEL.name;
$('#arch').innerHTML = railHTML();
$('#pick').innerHTML = pickHTML();
if (window.matchMedia && matchMedia('(max-width: 820px)').matches) $('#archbox').open = false;   /* 좁은 화면에서는 구조도를 접어 둔다 */
const rows = Array.from(document.querySelectorAll('#arch [data-go]'));
rows.forEach((el) => el.addEventListener('click', () => go(idxOf(el.dataset.go))));
function renderRail() {
  const s = STEPS[stepIdx];
  rows.forEach((el) => { if (s.row.indexOf(el.id) >= 0) el.setAttribute('aria-current', 'step'); else el.removeAttribute('aria-current'); });
  $('#where').textContent = s.st === -1 ? '전체 구조' : ST[s.st].name;
  $('#stitle').textContent = s.t;
  $('#sbody').innerHTML = s.h;
  $('#ssrc').textContent = s.src ? '출처: ' + s.src : '';
  $('#count').textContent = (stepIdx + 1) + ' / ' + STEPS.length;
  $('#prev').disabled = stepIdx === 0;
  const nx = $('#next'); nx.disabled = stepIdx === STEPS.length - 1;
  nx.textContent = stepIdx === 0 ? '시작' : '다음';
}
function go(i, snap) {
  stepIdx = clamp(i | 0, 0, STEPS.length - 1);
  const s = STEPS[stepIdx];
  cur.st = s.st; cur.ph = s.ph || 0;
  Object.assign(goal, camFor(s));
  sweep = null;
  if (s.sweep) { if (RM) goal.tz = s.sweep[1]; else sweep = { t: -SWD, a: s.sweep[0], b: s.sweep[1], T: s.sweep[2] }; }
  renderRail();
  if (snap) update(0, true);
  try { history.replaceState(null, '', '#s' + stepIdx); } catch (err) { /* 주소를 못 바꿔도 그림은 그대로 둔다 */ }
  wake();
}
/* 조건 고르기. snap이면 바로 끝 상태로(검사용) */
function setCond(c, snap) {
  cond = clamp(c | 0, 0, CONDS.length - 1); PAL.lora = PAL[CONDS[cond].color];
  document.querySelectorAll('#pick button[data-k]').forEach((b) => b.setAttribute('aria-pressed', +b.dataset.k === cond ? 'true' : 'false'));
  $('#arch').classList.toggle('nolora', !CONDS[cond].lora);
  document.documentElement.style.setProperty('--lora', 'var(--c-' + CONDS[cond].color + ')');
  if (snap) update(0, true);
  wake();
}
document.querySelectorAll('#pick button[data-k]').forEach((b) => b.addEventListener('click', () => setCond(+b.dataset.k)));
$('#prev').addEventListener('click', () => go(stepIdx - 1));
$('#next').addEventListener('click', () => go(stepIdx + 1));
$('#reset').addEventListener('click', () => { go(stepIdx); });
window.addEventListener('hashchange', () => { const m = /^#s(\d+)$/.exec(location.hash); if (m && +m[1] !== stepIdx) go(+m[1]); });

/* ---------------------------------------------------------------- 시작 */
function resize() {
  const r = stage.getBoundingClientRect();
  W = Math.max(50, r.width); H = Math.max(50, r.height); DPR = Math.min(2, window.devicePixelRatio || 1);
  cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
  const tz = goal.tz; Object.assign(goal, camFor(STEPS[stepIdx])); if (STEPS[stepIdx].sweep) goal.tz = tz;
  wake();
  draw();   /* 크기를 바꾸면 캔버스가 지워지므로 바로 다시 그린다 */
}
readPal();
setCond(cond);
new ResizeObserver(resize).observe(stage);
new MutationObserver(() => { readPal(); wake(); }).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme', 'class', 'style'] });
if (window.matchMedia) matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => { readPal(); wake(); });
if (document.fonts && document.fonts.ready) document.fonts.ready.then(wake);
resize();
const m0 = /^#s(\d+)$/.exec(location.hash);
go(m0 ? +m0[1] : 0, true);
requestAnimationFrame(frame);
/* 검사용 손잡이: 스크립트는 이것만 쓴다 */
window.__mf = {
  go, setCond, update, draw,
  steps: STEPS.length,
  sweepSeconds: (i) => { const s = STEPS[i]; return s && s.sweep && !RM ? SWD + s.sweep[2] + 1.0 : 0; },
  counts: COUNTS,
  conds: CONDS.length,
  stats: () => ({ boxes: boxes.length, lines: lines.length, texts: texts.length, fields: fields.length }),
  keys: STEPS.map((s) => s.key),
};
})();
</script>
